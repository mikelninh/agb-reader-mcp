[project]
name = "agb-reader-mcp"
version = "0.1.0"
description = "German Terms-of-Service (AGB) clause checker — detects unfair clauses against BGB §§ 305c/307/308/309 with verifiable § citations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mikel" }]
license = { text = "MIT" }

dependencies = [
    "mcp>=1.0.0",
    "civic-ai-mcp-toolkit>=0.1.0",
]

[project.scripts]
agb-reader-mcp = "agb_reader_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agb_reader_mcp*"]

[tool.setuptools.package-data]
"agb_reader_mcp" = ["data/*.json"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
